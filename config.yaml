# ========================================
# AI Trading Bot Configuration
# ========================================

# --- Watchlist ---
watchlist:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - NVDA
  - META
  - AMD
  - SPY
  - QQQ
  - SMCI
  - INTC
  - T
  - SOFI
  - BAC
  - NFLX
  - F
  - AAL
  - NVO
  - DELL

# --- Trading Parameters ---
trading:
  mode: paper                    # paper or live
  max_position_size: 5000        # max dollars per position (was 1000)
  max_daily_trades: 0            # 0 = unlimited trades per day
  max_open_positions: 10         # max concurrent positions
  min_volume: 500000             # minimum avg daily volume
  allowed_sides:
    - LONG
    - SHORT

# --- Risk Management ---
risk:
  risk_reward_ratio: 1.5         # minimum reward:risk (lowered from 2.0 for more trades)
  max_risk_per_trade_pct: 1.0    # max % of portfolio to risk per trade
  max_daily_loss_pct: 10.0       # stop trading if daily loss exceeds this % of portfolio
  trailing_stop:
    enabled: true
    activation_pct: 1.5          # activate trailing stop after 1.5% profit
    trail_pct: 1.5               # trail by 1.5% from high (was 0.5%)
  stop_loss:
    atr_multiplier: 2.0          # SL = entry +/- ATR * multiplier (was 1.5, wider to avoid noise)
  take_profit:
    atr_multiplier: 4.0          # TP = entry +/- ATR * multiplier (was 3.0, wider for bigger gains)

# --- Timeframes ---
timeframes:
  day_trading:
    analysis: "5m"               # 5-minute chart for analysis
    entry: "1m"                  # 1-minute chart for entry timing
    trend: "1h"                  # 1-hour chart for trend confirmation
  swing_trading:
    analysis: "1h"               # 1-hour chart for analysis
    entry: "15m"                 # 15-minute chart for entry timing
    trend: "1d"                  # daily chart for trend confirmation

# --- Technical Indicators (computed locally via ta library) ---
indicators:
  rsi:
    period: 14
    overbought: 70               # standard RSI levels (was 65)
    oversold: 30                 # standard RSI levels (was 35)
  macd:
    fast: 12
    slow: 26
    signal: 9
  ema:
    short: 9
    medium: 21
    long: 50
  bollinger:
    period: 20
    std_dev: 2
  volume:
    sma_period: 20

# --- AI Analysis ---
ai:
  model: "claude-sonnet-4-6"
  chart_analysis_enabled: true
  chart_cache_minutes: 15        # cache chart analysis results to reduce API calls
  confidence_threshold: 0.45     # min confidence to take a trade (lowered from 0.60 for more trades)

# --- Schedule ---
schedule:
  market_open: "09:30"
  market_close: "16:00"
  timezone: "US/Eastern"
  scan_interval_minutes: 2       # scan watchlist every N minutes
  pre_market_scan: "09:15"       # scan before market open

# --- AI Agents ---
agents:
  enabled: true
  market_regime:
    enabled: true
    refresh_interval_minutes: 15
    regimes:
      trending:
        sl_multiplier: 2.5
        tp_multiplier: 5.0
        confidence_threshold: 0.55
        position_scale: 1.0
      ranging:
        sl_multiplier: 1.5
        tp_multiplier: 2.5
        confidence_threshold: 0.50
        position_scale: 0.7
      volatile:
        sl_multiplier: 3.0
        tp_multiplier: 4.0
        confidence_threshold: 0.55
        position_scale: 0.5
  news_sentiment:
    enabled: true
    earnings_block_days: 2
    sentiment_refresh_minutes: 30
    sentiment_weight: 0.10
  trade_review:
    enabled: true
    auto_apply_suggestions: false
    batch_review_interval: 50    # only call Claude every N trades for strategic suggestions

# --- Correlation Filter ---
correlation:
  enabled: true
  max_correlation: 0.85
  max_sector_positions: 5
  sectors:
    tech:
      - AAPL
      - MSFT
      - GOOGL
      - NVDA
      - META
      - AMD
    index_etf:
      - SPY
      - QQQ
    mega_cap:
      - AMZN
      - TSLA

# --- VIX-based Position Sizing ---
vix_scaling:
  enabled: true
  thresholds:
    - vix_above: 30
      scale: 0.3
    - vix_above: 25
      scale: 0.5
    - vix_above: 20
      scale: 0.75
    - vix_above: 0
      scale: 1.0

# --- Performance Targets (auto-ratcheting daily goals) ---
performance_targets:
  initial_win_rate: 50.0           # starting win rate target (%)
  initial_pnl_pct: 2.0            # starting daily P&L target (%)
  win_rate_step: 2.0              # raise win rate target by this much when beating it
  pnl_pct_step: 0.5              # raise P&L target by this much when beating it
  lookback_days: 5                # compare against this many recent days

# --- Broker (IB Gateway) ---
broker:
  host: "127.0.0.1"
  port: 4002                     # 4002 for IB Gateway paper, 4001 for live
  client_id: 2
  timeout: 30
  readonly: false
